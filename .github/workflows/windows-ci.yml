name: Windows CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FindHistory.sln
      - name: Build Release
        run: dotnet build FindHistory.sln -c Release --no-restore
      - name: Run smoke tests
        run: dotnet run --project tests/FindHistory.SmokeTests/FindHistory.SmokeTests.csproj -c Release --no-build
